[project]
name = "g-file-studio"
version = "2.3.0"
description = "PySide6 desktop application for processing XML-based G files"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "pydantic>=2.10,<3",
    "platformdirs>=4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
